<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Care Online</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{ font-family:'Hind Siliguri', Arial, sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white max-w-sm w-full rounded-2xl shadow-lg border p-6 space-y-4">
    <div class="text-center space-y-1">
      <div class="w-12 h-12 bg-emerald-600 text-white text-xl rounded-xl flex items-center justify-center mx-auto mb-2 shadow">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="font-bold text-lg text-gray-800">Care Online Admin</h2>
      <p class="text-xs text-gray-500">সুরক্ষিত অ্যাডমিন কন্ট্রোল প্যানেল</p>
    </div>

    <form onsubmit="handleAdminLogin(event)" class="space-y-3 text-xs">
      <div>
        <label class="font-bold text-gray-700">অ্যাডমিন ইমেইল / ফোন</label>
        <input id="admUser" required placeholder="admin@careonline.com" class="w-full border rounded-xl p-2.5 mt-1 outline-none">
      </div>
      <div>
        <label class="font-bold text-gray-700">পাসওয়ার্ড</label>
        <input id="admPass" type="password" required placeholder="Password" class="w-full border rounded-xl p-2.5 mt-1 outline-none">
      </div>
      <button id="loginBtn" type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow">
        লগইন করুন
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="index.html" class="text-xs text-emerald-700 font-bold">← মূল ওয়েবসাইটে ফিরে যান</a>
    </div>
  </div>

<script>
const SUPABASE_URL = localStorage.getItem("care_supabase_url") || "https://your-project.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_g2QOYm3XX9swEUOCQ3fmVw_YhpGU1Kv";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function handleAdminLogin(e) {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "যাচাই করা হচ্ছে...";

  let email = document.getElementById("admUser").value.trim();
  const pass = document.getElementById("admPass").value;
  if(!email.includes("@")) email = `${email}@careonline.local`;

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;

    // প্রোফাইল থেকে রোল চেক করা (Security Check)
    const { data: profile } = await sb.from("profiles").select("role").eq("id", data.user.id).single();
    
    if(profile && (profile.role === 'admin' || profile.role === 'staff')) {
      alert("স্বাগতম অ্যাডমিন! প্যানেলে প্রবেশ করছেন...");
      window.location.href = "admin.html";
    } else {
      // যদি রোল অ্যাডমিন না হয়, তবে বাইপাস করতে দিবে না
      await sb.auth.signOut();
      alert("❌ অ্যাক্সেস ডিনায়েড! এই অ্যাকাউন্টের অ্যাডমিন পারমিশন নেই।");
    }
  } catch(err) {
    alert("লগইন ব্যর্থ: " + (err.message || "ভুল ইমেইল বা পাসওয়ার্ড"));
  } finally {
    btn.disabled = false;
    btn.textContent = "লগইন করুন";
  }
}
</script>
</body>
</html>
