<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">
  <title>আমার অর্ডারসমূহ | Care Online</title>

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', Arial, sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding-bottom: 85px; }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; z-index: 500; box-shadow: 0 -4px 20px rgba(0,0,0,.06); }
    .nav-btn { border: 0; background: none; color: #64748b; font-size: 11px; text-align: center; min-width: 60px; }
    .nav-btn span { display: block; font-size: 20px; margin-bottom: 2px; }
    .nav-btn.active { color: #ff5722; font-weight: bold; }
  </style>
</head>
<body>

  <!-- হেডার -->
  <header class="bg-[#087f5b] text-white p-4 sticky top-0 z-50 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-white text-xl"><i class="fa-solid fa-arrow-left"></i></a>
      <div>
        <h1 class="font-bold text-lg leading-tight">আমার অর্ডারসমূহ</h1>
        <p class="text-xs text-emerald-100">Care Online ব্যক্তিগত হিস্টোরি</p>
      </div>
    </div>
    <a href="index.html" class="bg-white/20 text-white text-xs px-3 py-1.5 rounded-xl font-bold">
      + নতুন অর্ডার
    </a>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- ট্রাস্ট ব্যানার -->
    <div class="bg-gradient-to-r from-emerald-800 to-teal-900 text-white p-4 rounded-2xl shadow-sm space-y-1.5">
      <div class="flex items-center gap-2 text-amber-300 font-bold text-sm">
        <i class="fa-solid fa-heart-pulse"></i>
        <span>Care Online-এ আপনাকে স্বাগতম!</span>
      </div>
      <p class="text-xs opacity-95 leading-relaxed">
        আমাদের সেবা ও ১০০% আসল ঔষধের মান ভালো লাগলে নির্দ্বিধায় পুনরায় অর্ডার করুন। আমরা আছি আপনার সুস্থতায় সার্বক্ষণিক।
      </p>
    </div>

    <!-- অর্ডার্স লিস্ট কন্টেইনার -->
    <div id="ordersContainer" class="space-y-4">
      <p class="text-center text-sm text-gray-400 py-12">আপনার অ্যাকাউন্ট ও অর্ডার লোড হচ্ছে...</p>
    </div>
  </main>

  <!-- বটম নেভিগেশন -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='index.html'">
      <span><i class="fa-solid fa-house"></i></span>Home
    </button>
    <button class="nav-btn active" onclick="window.location.href='orders.html'">
      <span><i class="fa-solid fa-bag-shopping"></i></span>Orders
    </button>
    <button class="nav-btn" onclick="window.location.href='index.html'">
      <span class="relative inline-block"><i class="fa-solid fa-cart-shopping"></i></span>Cart
    </button>
    <button class="nav-btn" onclick="window.location.href='account.html'">
      <span><i class="fa-solid fa-user"></i></span>Account
    </button>
  </nav>

  <script>
    const SUPABASE_URL = "https://vajqviaizmvwaemfgcgx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_g2QOYm3XX9swEUOCQ3fmVw_YhpGU1Kv";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      await fetchMyPersonalOrders();
    });

    async function fetchMyPersonalOrders() {
      const container = document.getElementById("ordersContainer");

      try {
        // ১. সেশন চেক করা
        const { data: { session } } = await sb.auth.getSession();

        const userId = session?.user?.id || null;
        const userPhone = (session?.user?.user_metadata?.phone || session?.user?.phone || localStorage.getItem("care_last_phone") || "").replace(/[^0-9]/g, '');
        const userEmail = session?.user?.email || "";

        if (!session && !userPhone) {
          container.innerHTML = `
            <div class="bg-white rounded-3xl p-8 text-center border shadow-sm space-y-3 mt-4">
              <div class="w-16 h-16 bg-emerald-50 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-3xl">
                <i class="fa-solid fa-user-lock"></i>
              </div>
              <h3 class="text-base font-bold text-gray-800">অর্ডার দেখতে লগইন করুন</h3>
              <p class="text-xs text-gray-500">আপনার ব্যক্তিগত সুরক্ষার জন্য শুধুমাত্র আপনার নিজস্ব অ্যাকাউন্টের অর্ডারগুলো প্রদর্শিত হবে।</p>
              <div class="pt-2">
                <a href="account.html" class="inline-block bg-[#087f5b] text-white text-sm font-bold py-2.5 px-6 rounded-xl shadow">
                  লগইন বা রেজিস্ট্রেশন করুন →
                </a>
              </div>
            </div>
          `;
          return;
        }

        // ২. মাস্টার অর্ডার লোড করা
        const { data: allOrders, error: ordErr } = await sb
          .from("orders")
          .select("*")
          .order("created_at", { ascending: false });

        if (ordErr) throw ordErr;

        // ৩. কাস্টমারের নির্দিষ্ট অর্ডার ফিল্টার করা
        const myOrders = (allOrders || []).filter(o => {
          if (userId && o.user_id === userId) return true;
          if (userPhone && o.customer_phone && o.customer_phone.replace(/[^0-9]/g, '').includes(userPhone)) return true;
          if (userEmail && o.customer_email && o.customer_email.toLowerCase() === userEmail.toLowerCase()) return true;
          return false;
        });

        if (!myOrders.length) {
          container.innerHTML = `
            <div class="bg-white rounded-3xl p-8 text-center border shadow-sm space-y-3 mt-4">
              <div class="w-16 h-16 bg-slate-100 text-gray-400 rounded-full flex items-center justify-center mx-auto text-3xl">
                <i class="fa-solid fa-box-open"></i>
              </div>
              <h3 class="text-base font-bold text-gray-800">আপনার কোনো অর্ডার নেই</h3>
              <p class="text-xs text-gray-500">আপনার এই অ্যাকাউন্টে এখনো কোনো অর্ডার সক্রিয় নেই।</p>
              <div class="pt-2">
                <a href="index.html" class="inline-block bg-[#087f5b] text-white text-sm font-bold py-2.5 px-6 rounded-xl shadow">
                  🛒 এখনই শপিং করুন
                </a>
              </div>
            </div>
          `;
          return;
        }

        // ৪. প্রতিটি অর্ডারের আইটেম লোড করা
        const orderIds = myOrders.map(o => o.id);
        const { data: allItems } = await sb
          .from("order_items")
          .select("*")
          .in("order_id", orderIds);

        // আইটেম ম্যাপ তৈরি
        const itemsByOrderId = {};
        (allItems || []).forEach(it => {
          if (!itemsByOrderId[it.order_id]) itemsByOrderId[it.order_id] = [];
          itemsByOrderId[it.order_id].push(it);
        });

        // ৫. সুন্দর ও বড় কার্ডে রেন্ডার করা
        container.innerHTML = myOrders.map(o => {
          const items = itemsByOrderId[o.id] || [];

          let statusText = "পেন্ডিং (যাচাই চলছে)";
          let statusBadge = "bg-amber-100 text-amber-900 border-amber-300";
          let step = 1;

          if (o.order_status === 'confirmed' || o.order_status === 'processing') {
            statusText = "প্রসেসিং হচ্ছে ✓";
            statusBadge = "bg-blue-100 text-blue-900 border-blue-300";
            step = 2;
          } else if (o.order_status === 'shipped') {
            statusText = "ডেলিভারির পথে আছে 🚚";
            statusBadge = "bg-purple-100 text-purple-900 border-purple-300";
            step = 3;
          } else if (o.order_status === 'delivered') {
            statusText = "ডেলিভারি সম্পন্ন হয়েছে 🏠";
            statusBadge = "bg-emerald-100 text-emerald-900 border-emerald-300";
            step = 4;
          } else if (o.order_status === 'cancelled') {
            statusText = "অর্ডার বাতিল ✕";
            statusBadge = "bg-red-100 text-red-900 border-red-300";
            step = 0;
          }

          // তারিখ ও সময় বাংলা ফরম্যাট
          const d = new Date(o.created_at);
          const dateFormatted = isNaN(d.getTime()) ? "আজকের তারিখ" : d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
          const timeFormatted = isNaN(d.getTime()) ? "" : d.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit', hour12: true });

          const waMsg = encodeURIComponent(`হ্যালো Care Online! আমি আমার অর্ডার #${o.order_number} সম্পর্কে জানতে চাই।`);

          return `
            <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-sm text-sm space-y-3.5">
              
              <!-- অর্ডার হেডার -->
              <div class="flex justify-between items-start border-b border-slate-100 pb-3">
                <div>
                  <span class="font-bold text-gray-900 text-base font-mono">#${o.order_number}</span>
                  <p class="text-xs text-gray-600 mt-0.5">📅 <strong>${dateFormatted}</strong> | ⏰ <strong>${timeFormatted}</strong></p>
                </div>
                <span class="font-bold text-xs px-3 py-1 rounded-full border ${statusBadge}">${statusText}</span>
              </div>

              <!-- ভিজ্যুয়াল ডেলিভারি ট্র্যাকার -->
              ${step > 0 ? `
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
                  <div class="flex justify-between text-[10px] font-bold text-gray-500">
                    <span class="${step >= 1 ? 'text-emerald-800' : ''}">১. গৃহীত</span>
                    <span class="${step >= 2 ? 'text-emerald-800' : ''}">২. কনফার্মড</span>
                    <span class="${step >= 3 ? 'text-emerald-800' : ''}">৩. পথে আছে</span>
                    <span class="${step >= 4 ? 'text-emerald-800' : ''}">৪. ডেলিভার্ড</span>
                  </div>
                  <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                    <div class="bg-emerald-600 h-full transition-all duration-500" style="width: ${step * 25}%"></div>
                  </div>
                </div>
              ` : ''}

              <!-- অর্ডারকৃত প্রোডাক্টের বড় তালিকা -->
              <div class="space-y-2.5 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                <strong class="text-xs text-gray-800 block mb-1">🛍️ আপনার অর্ডারকৃত পণ্যসমূহ:</strong>
                ${items.map(item => `
                  <div class="flex items-center justify-between gap-3 bg-white p-2.5 rounded-xl border border-slate-100 shadow-xs">
                    <div class="flex items-center gap-3">
                      <img src="${item.product_image || 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=200'}" class="w-14 h-14 object-cover rounded-xl border bg-slate-50 flex-shrink-0">
                      <div>
                        <h4 class="font-bold text-gray-900 text-sm leading-snug">${item.product_name}</h4>
                        <p class="text-xs text-gray-500 mt-1">৳${item.unit_price} × <span class="font-bold text-gray-900">${item.quantity} পিস</span></p>
                      </div>
                    </div>
                    <strong class="text-emerald-800 text-sm whitespace-nowrap">৳${item.subtotal}</strong>
                  </div>
                `).join("")}
              </div>

              <!-- ঠিকানা ও মোট বিল -->
              <div class="space-y-1.5 text-xs bg-emerald-50/50 p-3.5 rounded-2xl border border-emerald-100 text-gray-700">
                <p><strong>📍 ডেলিভারি ঠিকানা:</strong> ${o.delivery_address} (${o.district})</p>
                <p><strong>💳 পেমেন্ট মাধ্যম:</strong> ${o.payment_method} ${o.transaction_id && o.transaction_id !== 'N/A' ? `<span class="block bg-white p-1 rounded-lg border border-emerald-200 mt-1 font-bold text-emerald-900">${o.transaction_id}</span>` : ''}</p>
                <div class="flex justify-between items-center pt-2 border-t border-emerald-200 font-bold text-sm text-gray-900 mt-1">
                  <span>সর্বমোট প্রদেয় বিল:</span>
                  <strong class="text-base text-emerald-800">৳${o.total}</strong>
                </div>
              </div>

              <!-- WhatsApp সরাসরি সাপোর্ট -->
              <a href="https://wa.me/8801892291817?text=${waMsg}" target="_blank" class="w-full bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold py-2.5 px-4 rounded-2xl flex items-center justify-center gap-2 shadow text-xs transition">
                <i class="fa-brands fa-whatsapp text-base"></i>
                <span>এই অর্ডার নিয়ে WhatsApp-এ কথা বলুন</span>
              </a>
            </div>
          `;
        }).join("");

      } catch (err) {
        console.error("Order load error:", err);
        container.innerHTML = `<div class="bg-white p-6 text-center rounded-2xl border text-xs text-red-500">অর্ডার লোড করতে সমস্যা হয়েছে। দয়া করে পেজটি রিফ্রেশ দিন।</div>`;
      }
    }
  </script>
</body>
</html>
